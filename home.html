<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Home</title>

<style>

body {
    background-color: pink;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 50px;
}

.kotak {
    background-color: white;
    width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 5px 15px gray;
}

h1 {
    color: pink;
}

.judul {
    color: pink;
    font-size: 30px;
}

p {
    color: pink;
    font-size: 16px;
    background-color: #d5f5f1;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
}

/* Tambahan styling untuk poin keunggulan & tombol */
.poin {
    background-color: white;
    border: 2px solid #008f83;
    color: pink;
    font-weight: bold;
    padding: 10px;
    border-radius: 8px;
    margin: 8px 0;
}

.tombol {
    display: inline-block;
    background-color: pink;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 10px;
}

</style>

</head>

<body>

<div class="kotak">

<h1 class="judul">Selamat Datang</h1>

<h2>Di Nikey's Store Skincare</h2>

<p>Kami menyediakan produk skincare yang ada di bawah</p>

<div class="poin"> glag2glow </div>
<div class="poin"> Scora</div>
<div class="poin"> Skintific</div>

</div>

</body>

</html>
